name: macOS Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build feeder
        run: |
          chmod +x build.sh scripts/*.sh
          mkdir -p bin
          ./build.sh

      - name: Build menu bar app
        run: ./scripts/build-app.sh

      - name: Package v1.0.0 release
        run: ./scripts/package-release.sh

      - name: Verify release packages
        run: |
          test -f dist/release/PS3-Camera-macOS-Driver-v1.0.0.dmg
          test -f dist/release/PS3-Camera-macOS-Driver-v1.0.0.zip
          test -f dist/release/SHA256SUMS.txt
          cat dist/release/SHA256SUMS.txt

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: PS3-Camera-macOS-Driver-v1.0.0
          path: |
            dist/release/PS3-Camera-macOS-Driver-v1.0.0.dmg
            dist/release/PS3-Camera-macOS-Driver-v1.0.0.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
